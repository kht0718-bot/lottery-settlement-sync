<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1f6feb"><link rel="manifest" href="/manifest.webmanifest"><title>복권 정산</title><style>:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#18212f;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e5e9f2;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 4px 18px #1520330a}h1{font-size:22px;margin:0 0 6px}h2{font-size:18px;margin:0 0 12px}.muted{color:#687386;font-size:14px}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stock-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.stock-card{border:1px solid #e1e7f0;border-radius:12px;padding:12px;margin:10px 0;background:#fbfcff}label{display:grid;gap:6px;font-size:14px;font-weight:600}input,textarea,select,button{font:inherit}input,textarea,select{width:100%;padding:11px;border:1px solid #ccd4e0;border-radius:10px;background:#fff}textarea{min-height:80px;resize:vertical}button{padding:11px 14px;border:0;border-radius:10px;background:#1f6feb;color:#fff;font-weight:700;cursor:pointer}button.secondary{background:#e9eef7;color:#263449}button.danger{background:#c93b3b}.hidden{display:none!important}.badge{padding:4px 9px;border-radius:999px;background:#eef4ff;color:#1754a1;font-size:12px;font-weight:700}.item{border-top:1px solid #edf0f5;padding:12px 0}.item:first-child{border-top:0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px;border:1px solid #dde4ef;cursor:zoom-in}.photo-modal{position:fixed;inset:0;background:#000b;z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}.photo-modal.hidden{display:none!important}.photo-modal img{max-width:96vw;max-height:86vh;transform-origin:center;cursor:grab}.photo-modal .modal-actions{position:absolute;top:14px;right:14px;display:flex;gap:8px}.error{color:#b42318}.ok{color:#16794c}.stock-summary{font-size:13px;line-height:1.6}.note{font-size:13px;color:#526071}@media(max-width:700px){.grid,.stock-grid{grid-template-columns:1fr 1fr}.wrap{padding:12px}.card{border-radius:13px;padding:15px}}@media(max-width:460px){.grid,.stock-grid{grid-template-columns:1fr}.photos{grid-template-columns:repeat(3,1fr)}}</style></head><body><main class="wrap"><section id="loginView" class="card"><h1>복권 정산</h1><form id="loginForm" class="grid"><label>아이디<input id="username" autocomplete="username" required></label><label>비밀번호<input id="password" type="password" autocomplete="current-password" required></label><div class="actions"><button type="submit">로그인</button></div></form><p id="loginMsg" class="muted"></p></section><section id="appView" class="hidden"><header class="card row between"><div><h1>복권 정산</h1><div id="userInfo" class="muted"></div></div><button id="logoutBtn" class="secondary">로그아웃</button></header><nav class="card row" id="navBar"><button class="secondary" data-view="home">홈</button><button class="secondary" data-view="history">내역</button><button class="secondary" data-view="inventory">재고</button><button class="secondary" data-view="manage">관리</button></nav><section id="homeView"><section id="homeDashboard" class="card"><h2>오늘의 정산</h2><p id="homeDashboardMsg" class="muted">정산 정보를 불러오는 중...</p><div id="homeMetrics" class="grid hidden"></div><div id="homeQuickMenu" class="actions"></div><div id="adminShiftWorkflow" class="card hidden" style="margin-top:12px"><h2>관리자 정산 업무</h2><div class="actions"><button type="button" data-admin-shift="pre">근무 전</button><button type="button" class="secondary" data-admin-shift="post">근무 후</button><button type="button" class="secondary" data-admin-shift="approval">승인</button></div></div><div id="adminSyncHome" class="actions hidden"><button type="button" class="secondary" data-home-view="settings">관리자 동기화 설정</button></div></section><section id="createCard" class="card"><div id="shiftTabs" class="actions"><button type="button" data-shift-view="pre">근무 전 정산</button><button type="button" class="secondary" data-shift-view="post">근무 후 정산</button></div><form id="settlementForm"><section id="preShiftWorkflow"><section class="card" style="margin:0 0 12px"><h2>근무 전 정산</h2><div class="grid"><label>영업일<input id="businessDate" type="date" required></label><label>근무 전 금고 금액<input id="preSafeAmount" type="number" min="0" step="1" value="0"></label></div><div class="actions"><button type="button" id="loadCarryoverBtn" class="secondary">승인된 마감 재고 불러오기</button><button type="button" id="savePreShiftBtn" class="secondary">근무 전 정산 저장</button></div></section><section class="card" style="margin:0 0 12px"><h3>인쇄복권 재고</h3><div id="stockItems"></div><div class="actions"><button type="button" id="addStockBtn" class="secondary">복권 재고 추가</button></div></section><section class="card" style="margin:0 0 12px"><h3>근무 전 반품</h3><div id="preReturnItems"></div><div class="actions"><button type="button" id="addPreReturnBtn" class="secondary">근무 전 반품 추가</button></div></section></section><section id="postShiftWorkflow" class="hidden"><section class="card" style="margin:0 0 12px"><h2>근무 후 정산</h2></section><section class="card" style="margin:0 0 12px"><h3>근무 중 입고 / 반품</h3><div id="dutyAdjustItems"></div><div class="actions"><button type="button" id="addDutyAdjustBtn" class="secondary">근무 중 입고 / 반품 추가</button></div></section><section class="card" style="margin:0 0 12px"><h3>마감 재고</h3><div id="endingStockItems"></div><div class="actions"><button type="button" id="addEndingStockBtn" class="secondary">마감 재고 추가</button></div></section><section class="card" style="margin:0"><h3>근무 후 정산</h3><div class="grid"><label>현금 등록액<input id="cashAmount" type="number" min="0" step="1" value="0"></label><label>근무 후 금고 금액<input id="safeAmount" type="number" min="0" step="1" value="0"></label><label>팁/기타<input id="tipAmount" type="number" step="1" value="0"></label></div><label>메모<textarea id="memo" placeholder="정산 메모 / 인수인계"></textarea></label><label>사진 증빙 (최대 8장)<input id="photos" type="file" accept="image/*" capture="environment" multiple></label><div id="photoPreview" class="photos"></div><div class="actions"><button type="submit">근무 후 정산 완료 · 승인 요청</button></div></section></form></section><p id="formMsg" class="muted"></p></section></section><section id="historyView" class="card"><div class="row between"><h2>정산 내역</h2><button id="refreshBtn" class="secondary">새로고침</button></div><div id="list" class="muted">불러오는 중...</div></section><section id="inventoryView" class="card hidden"><div class="row between"><h2>복권 재고</h2><button id="refreshInventoryBtn" class="secondary">새로고침</button></div><div id="inventoryList" class="muted">불러오는 중...</div></section><section id="manageView" class="card hidden"><h2>관리</h2><p id="manageRoleMsg" class="muted hidden"></p><div id="employeeManage" class="hidden"><div class="actions"><button type="button" id="manageApprovalBtn">정산 업무</button><button type="button" id="manageStaffBtn" class="secondary">직원 관리</button><button type="button" id="manageDeviceBtn" class="secondary">등록기기 관리</button></div><section id="staffManagePanel" class="card"><h2>직원 관리</h2><div id="employeeList" class="muted"></div></section><section id="deviceManagePanel" class="card hidden"><h2>등록기기 관리</h2><p class="muted">현재 웹에 등록·로그인된 기기를 관리합니다.</p><div id="deviceList" class="muted"></div></section><section id="webAccountPanel" class="card hidden"><h3>웹 계정 연결</h3><form id="webUserForm"><div class="grid"><label>직원 ID<input id="webStaffId" required placeholder="등록된 직원 ID"></label><label>웹 아이디<input id="webNewUsername" required></label><label>웹 비밀번호<input id="webNewPassword" type="password" minlength="8" required></label><label>역할<select id="webNewRole"><option value="employee">직원</option><option value="admin">관리자</option></select></label></div><button type="submit">웹 계정 연결</button></form><p id="webUserMsg" class="muted"></p></section></div></section><section id="detailView" class="card hidden"><h2>정산 상세</h2><div id="detailContent" class="muted">정산을 선택하세요.</div></section><section id="approvalView" class="card hidden"><h2>정산 승인 관리</h2><div id="approvalList" class="muted">불러오는 중...</div></section><section id="settingsView" class="card hidden"><h2>관리자 동기화 설정</h2><div class="card"><b>데이터 동기화</b><button id="syncNowBtn" class="secondary">지금 동기화</button><p id="syncMsg" class="muted"></p></div></section></section></main><div id="photoModal" class="photo-modal hidden"><div class="modal-actions"><button type="button" id="photoZoomOut" class="secondary">−</button><button type="button" id="photoZoomIn">＋</button><button type="button" id="photoClose" class="danger">닫기</button></div><img id="photoModalImg" alt="확대 사진"></div><script src="/app.js"></script></body></html>
