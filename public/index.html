<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><link rel="manifest" href="/manifest.webmanifest"><title>로또 정산</title><style>
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f5f5f7;color:#111}main{max-width:760px;margin:auto;padding:20px}.card{background:#fff;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 1px 4px #0001}input,textarea,select,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #ddd;width:100%;box-sizing:border-box;margin:6px 0}button{background:#111;color:#fff;border:0;font-weight:700}.hidden{display:none}.row{display:flex;gap:8px}.row>*{flex:1}.item{border-top:1px solid #eee;padding:12px 0}.status{font-size:.9em;color:#666}.photos img{max-width:96px;max-height:96px;object-fit:cover;border-radius:8px;margin:4px}
</style></head><body><main><h1>로또 정산</h1><div id="login" class="card"><h2>로그인</h2><input id="username" placeholder="아이디" autocomplete="username"><input id="password" type="password" placeholder="비밀번호" autocomplete="current-password"><button id="loginBtn">로그인</button><p id="loginMsg"></p></div>
<div id="app" class="hidden"><div class="card"><div class="row"><div><b id="who"></b><div id="role" class="status"></div></div><button id="logoutBtn">로그아웃</button></div></div>
<div class="card"><h2>정산 등록</h2><input id="businessDate" type="date"><textarea id="memo" rows="4" placeholder="정산 내용"></textarea><input id="photos" type="file" accept="image/*" capture="environment" multiple><div id="preview" class="photos"></div><button id="saveBtn">정산 저장</button><p class="status">사진은 최대 8장까지 첨부할 수 있습니다.</p></div>
<div id="adminBox" class="card hidden"><h2>관리자 기능</h2><div id="adminHint" class="status">승인대기 정산을 승인 또는 반려할 수 있습니다.</div></div>
<div class="card"><h2>정산 내역</h2><div id="list"></div></div></div></main><script src="/app.js"></script></body></html>
