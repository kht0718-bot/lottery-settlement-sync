<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1f6feb"><link rel="manifest" href="/manifest.webmanifest"><title>복권 정산</title><style>:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#18212f;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e5e9f2;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 4px 18px #1520330a}h1{font-size:22px;margin:0 0 6px}h2{font-size:18px;margin:0 0 12px}.muted{color:#687386;font-size:14px}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stock-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.stock-card{border:1px solid #e1e7f0;border-radius:12px;padding:12px;margin:10px 0;background:#fbfcff}label{display:grid;gap:6px;font-size:14px;font-weight:600}input,textarea,button{font:inherit}input,textarea{width:100%;padding:11px;border:1px solid #ccd4e0;border-radius:10px;background:#fff}textarea{min-height:80px;resize:vertical}button{padding:11px 14px;border:0;border-radius:10px;background:#1f6feb;color:#fff;font-weight:700;cursor:pointer}button.secondary{background:#e9eef7;color:#263449}button.danger{background:#c93b3b}.hidden{display:none!important}.badge{padding:4px 9px;border-radius:999px;background:#eef4ff;color:#1754a1;font-size:12px;font-weight:700}.item{border-top:1px solid #edf0f5;padding:12px 0}.item:first-child{border-top:0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px;border:1px solid #dde4ef}.error{color:#b42318}.ok{color:#16794c}.stock-summary{font-size:13px;line-height:1.6}.note{font-size:13px;color:#526071}@media(max-width:700px){.grid,.stock-grid{grid-template-columns:1fr 1fr}.wrap{padding:12px}.card{border-radius:13px;padding:15px}}@media(max-width:460px){.grid,.stock-grid{grid-template-columns:1fr}.photos{grid-template-columns:repeat(3,1fr)}}</style></head><body><main class="wrap"><section id="loginView" class="card"><h1>복권 정산</h1><p class="muted">관리자와 직원이 같은 URL에서 로그인하면 역할에 맞는 화면으로 자동 전환됩니다.</p><form id="loginForm" class="grid"><label>아이디<input id="username" autocomplete="username" required></label><label>비밀번호<input id="password" type="password" autocomplete="current-password" required></label><div class="actions"><button type="submit">로그인</button></div></form><p id="loginMsg" class="muted"></p></section><section id="appView" class="hidden"><header class="card row between"><div><h1>복권 정산</h1><div id="userInfo" class="muted"></div></div><button id="logoutBtn" class="secondary">로그아웃</button></header><section id="createCard" class="card"><h2>새 정산</h2><form id="settlementForm"><div class="grid"><label>영업일<input id="businessDate" type="date" required></label><label>현금 등록액<input id="cashAmount" type="number" min="0" step="1" value="0"></label><label>금고 금액<input id="safeAmount" type="number" min="0" step="1" value="0"></label><label>팁/기타<input id="tipAmount" type="number" step="1" value="0"></label></div><h2 style="margin-top:20px">인쇄복권 재고 / 반품</h2><p class="note">원재고 → 근무 전 반품 → 반품 반영 재고를 기준으로 근무 중 반품·입고·마감 재고를 계산합니다. 반품은 판매액에 포함되지 않습니다.</p><div id="stockItems"></div><div class="actions"><button type="button" id="addStockBtn" class="secondary">복권 항목 추가</button></div><label>메모<textarea id="memo" placeholder="정산 메모"></textarea></label><label>사진 증빙 (최대 8장)<input id="photos" type="file" accept="image/*" capture="environment" multiple></label><div id="photoPreview" class="photos"></div><div class="actions"><button type="submit">승인 요청</button></div></form><p id="formMsg" class="muted"></p></section><section class="card"><div class="row between"><h2>정산 내역</h2><button id="refreshBtn" class="secondary">새로고침</button></div><div id="list" class="muted">불러오는 중...</div></section></section></main><script src="/app.js"></script></body></html>
