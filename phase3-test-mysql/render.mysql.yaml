services:
  - type: pserv
    name: lottery-settlement-sync-web-phase3-mysql
    runtime: docker
    plan: free
    repo: https://github.com/kht0718-bot/lottery-settlement-sync
    branch: web-phase3-readonly
    dockerfilePath: ./phase3-test-mysql/Dockerfile
    envVars:
      - key: MYSQL_DATABASE
        value: lottery_settlement_sync_test
      - key: MYSQL_USER
        value: phase3_test
      - key: MYSQL_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 10
